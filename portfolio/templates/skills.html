{% extends 'base.html' %}

{% block content %}

    <section class="skills-page">
        <div class="section-heading">
            <p class="eyebrow">Technical Expertise</p>
            <h1>Skills &amp; Capabilities</h1>
            <p>Technologies, frameworks, and database tools I utilize to engineer scalable web products.</p>
        </div>

        <!-- Category Filter Tabs -->
        <div class="skill-filters">
            <button class="filter-btn active" data-filter="all">All Skills</button>
            <button class="filter-btn" data-filter="backend">Backend</button>
            <button class="filter-btn" data-filter="frontend">Frontend</button>
            <button class="filter-btn" data-filter="database">Database</button>
            <button class="filter-btn" data-filter="tools">Tools</button>
        </div>

                <!-- Skills Grid with Animated Bars & Counter -->
                <div class="skills-container">
                    {% for skill in skills %}
                    <div class="skill-card" data-group="{{ skill.group }}" data-level="{{ skill.level }}">
                        <div class="skill-title-row">
                            <div class="skill-title-left">
                                <h2>{{ skill.name }}</h2>
                                <span class="skill-group-badge">{{ skill.group }}</span>
                            </div>
                            <span class="skill-percent-label">{{ skill.level }}%</span>
                        </div>
    <div class="skill-bar">
        <div class="skill-fill" style="width: {{ skill.level }}%;"></div>
    </div>
    </div>
    {% endfor %}
    </div>
</section>

{% endblock %}
